# Local WordPress for the rate1-connector integration tests.
#   docker compose -f wp-plugin/tests/docker-compose.yml up -d
# WordPress: http://localhost:8088 (php-fpm 8.3 behind nginx, so
# fastcgi_finish_request() exists like on most production hosts).
# The mock collector runs on the host (port 4010) and is reached from the
# containers at http://host.docker.internal:4010.
name: rate1-wp-test

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_HOME', 'http://localhost:8088' );
    define( 'WP_SITEURL', 'http://localhost:8088' );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'RATE1_CONNECTOR_COLLECT_URL', 'http://host.docker.internal:4010' );

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: rate1-test-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  web:
    image: nginx:1.27-alpine
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  wordpress:
    image: wordpress:php8.3-fpm-alpine
    network_mode: "service:web"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  cli:
    image: wordpress:cli-php8.3
    network_mode: "service:web"
    depends_on:
      - wordpress
    environment: *wp-env
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./fixtures:/fixtures:ro
      - ../dist:/dist:ro
    entrypoint: ["sleep", "infinity"]

volumes:
  wp:
