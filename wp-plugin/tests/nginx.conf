# Test environment only. nginx and php-fpm share one network namespace, so
# PHP inside the container reaches its own site at http://localhost:8088
# (needed for the plugin's homepage check and WP-Cron loopback requests).
server {
    listen 8088;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Lets LiteSpeed Cache believe it runs on a LiteSpeed server, so its page
        # optimisation (JS delay) really runs in the compatibility test.
        fastcgi_param X-LSCACHE on;
    }
}
