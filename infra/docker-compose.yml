# Rate 1 PoC stack. Deployed by infra/deploy/deploy.sh with --env-file /opt/rate1/.env (server only).
name: rate1

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-bazed.live}
    volumes:
      # Directory mount (not a single file) so a git checkout of a new Caddyfile is visible to `caddy reload`.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  ingest:
    # Built on the server from the deployed commit (deploy.sh runs `compose build`); image rate1-ingest.
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}   # deploy.sh exports the deployed commit; shown by GET /healthz
      ENV: ${ENV}
      DATABASE_URL: postgres://ingest_rw:${INGEST_DB_PASSWORD}@postgres:5432/rate1
      COLLECT_BASE_URL: ${COLLECT_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, internal]

  app:
    # Built on the server from the deployed commit (deploy.sh runs `compose build`); image rate1-app.
    # Today a static build of the dashboard (mocked data) served by Caddy on :3000.
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      ENV: ${ENV}
      DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD}@postgres:5432/rate1
      COLLECT_BASE_URL: ${COLLECT_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, internal]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rate1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/rate1/.env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set in /opt/rate1/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in /opt/rate1/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rate1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

networks:
  # Caddy + the two web services. Its CIDRs are TRUSTED_PROXY_CIDRS for ingest: Caddy is the only proxy in it.
  # IPv6 must be on: without it Docker relays IPv6 clients through docker-proxy and every IPv6 visitor
  # reaches Caddy as the gateway 172.30.0.1 instead of their real address.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:30::/64
  # Database network: no route to the internet, no published ports.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24

volumes:
  caddy_data:
  caddy_config:
  pgdata:
