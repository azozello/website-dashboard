# Postgres 16 for the real-chain test (npm run test:e2e). Throwaway data.
#   docker compose -f docker-compose.test.yml up -d
name: rate1-ingest-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rate1
      POSTGRES_USER: rate1
      POSTGRES_PASSWORD: rate1
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rate1 -d rate1']
      interval: 2s
      retries: 30
