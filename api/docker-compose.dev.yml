# Postgres 16 for local development and the API tests (npm test creates its own
# database rate1_api_test in this server). Loopback only.
#   npm run db:up
name: rate1-app-api-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rate1
      POSTGRES_USER: rate1
      POSTGRES_PASSWORD: rate1
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rate1 -d rate1']
      interval: 2s
      retries: 30

volumes:
  pgdata:
